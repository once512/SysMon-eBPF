# Both hosts read this file. Replace paths and install as root-owned mode 0600.
revision 1
protect "/absolute/path/important.txt"
fanotify-file "/absolute/path/gated.txt"
fanotify-event open
fanotify-decision deny
fanotify-timeout-ms 250
fanotify-max-pending 64
fanotify-timeout-decision deny
fanotify-overload-decision deny
# For analysis, remove fanotify-decision and add:
# fanotify-analyzer "/absolute/path/build/secmon-analyzer"
# fanotify-marker "BLOCK"
# fanotify-scan-limit-bytes 65536
# fanotify-error-decision deny
